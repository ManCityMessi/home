<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>曼城十号梅西</title>
<link rel="icon" href="./assets/favicon.svg">
<style>
  html,body{margin:0;height:100%;background:#05080f;color:#e8eefb;overflow:hidden;
    font:14px/1.6 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  body::before{
    content:"";position:fixed;inset:-2px;pointer-events:none;
    background-image:
      linear-gradient(to right,rgba(90,150,255,.10) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(90,150,255,.10) 1px,transparent 1px);
    background-size:32px 32px;
    mask-image:radial-gradient(90% 70% at 50% 45%,#000 35%,transparent 100%);
    -webkit-mask-image:radial-gradient(90% 70% at 50% 45%,#000 35%,transparent 100%);
  }
  body::after{
    content:"";position:fixed;inset:-10%;pointer-events:none;
    background:
      radial-gradient(38% 34% at 20% 10%,rgba(79,140,255,.32),transparent 70%),
      radial-gradient(34% 30% at 84% 8%,rgba(160,107,255,.26),transparent 70%),
      radial-gradient(40% 34% at 66% 92%,rgba(34,211,238,.18),transparent 72%);
    filter:blur(10px);
  }
  .box{position:relative;z-index:1;height:100%;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:18px}
  .mark{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;
    font:800 30px/1 ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;color:#fff;
    background:linear-gradient(140deg,#4f8cff,#a06bff);
    box-shadow:0 24px 50px -22px rgba(79,140,255,.9),inset 0 0 0 1px rgba(255,255,255,.28);
    position:relative;animation:pop .7s cubic-bezier(.22,.68,.28,1) both}
  .mark::after{content:"";position:absolute;inset:-8px;border-radius:32px;
    border:1px solid rgba(79,140,255,.45);animation:ring 2.4s ease-in-out infinite}
  h1{margin:0;font-size:20px;font-weight:750;letter-spacing:.02em;
    background:linear-gradient(96deg,#e8eefb,#4f8cff 60%,#a06bff);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:11px;letter-spacing:.28em;color:#6b7a97;text-transform:uppercase}
  .bar{width:180px;height:3px;border-radius:99px;background:rgba(122,168,255,.18);overflow:hidden}
  .bar i{display:block;height:100%;width:40%;border-radius:99px;
    background:linear-gradient(90deg,#4f8cff,#22d3ee);
    animation:load 1.15s cubic-bezier(.5,0,.5,1) infinite}
  a{color:#7aa8ff;text-decoration:none;font-size:12.5px;border-bottom:1px solid rgba(122,168,255,.4)}
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.94)}to{opacity:1;transform:none}}
  @keyframes ring{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:.9;transform:scale(1.06)}}
  @keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
  @media (prefers-reduced-motion:reduce){.mark,.mark::after,.bar i{animation:none}}
</style>
<script>
(function () {
  var t = Date.now ? Date.now() : new Date().getTime();
  /* 转发时保留原有查询参数（例如 ?key=绑定密钥），否则绑定会被丢掉 */
  var q = location.search ? location.search.replace(/^\?/, "") : "";
  location.replace("./home3.html?" + (q ? q + "&" : "") + "t=" + t);
})();
</script>
</head>
<body>
  <div class="box">
    <div class="mark">10</div>
    <h1>曼城十号梅西</h1>
    <div class="sub">loading workspace</div>
    <div class="bar"><i></i></div>
    <p><a href="./home3.html">如果没有自动跳转，点这里</a></p>
  </div>
</body>
</html>
