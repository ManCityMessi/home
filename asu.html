<!DOCTYPE html>

<style>
  :root{
    --background:#080b12; --foreground:#e9eff9; --card:#0e1420;
    --border:#1d2637; --muted:#131b2a; --muted-foreground:#98a7bf;

  body{margin:0;padding:26px 18px 64px;background:
      radial-gradient(1000px 520px at 10% -14%, rgba(91,140,255,.14), transparent 62%),

<body>
<div class="wrap">
  <a class="back" href="./home3.html">&#8592; 曼城十号梅西</a>
  <div class="head">
    <div class="brandline">
      <span class="linde">Linde <small>AIR SEPARATION</small></span>
      <span class="kicker">AIR SEPARATION UNIT / 3D</span>
    </div>
    <h1>空分装置工艺流程 · 三维布置</h1>
    <p>按工艺顺序排列的装置三维示意：过滤压缩 → 空冷塔 / 水冷塔预冷 → 分子筛纯化 → 冷箱换热与精馏 → 储运外送。可点步骤看设备，或点「镜头巡游」自动逐段巡航。</p>
  </div>
  <div style="margin-top:16px">
<div id="asu3d-root">
  <style>
    #asu3d-root { position: relative; width: 100%; }
    #asu3d-root .asu-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; }
    #asu3d-root .asu-title h2 { margin: 0; }
    #asu3d-root .asu-stage {
      position: relative; width: 100%; aspect-ratio: 16 / 10; min-height: 240px;
      margin: 10px 0 12px; overflow: hidden; border-radius: 10px;
      background: linear-gradient(180deg, #4d8fd6 0%, #7db2e4 42%, #cfe2f3 68%, #eef3f8 100%);
    }
    #asu3d-root canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #asu3d-root .asu-labels { position: absolute; inset: 0; pointer-events: none; }
    #asu3d-root .asu-label {
      position: absolute; transform: translate(-50%, -100%);
      padding: 2px 7px; border-radius: 6px; white-space: nowrap;
      color: #0f2338; background: rgba(255,255,255,.86); border: 1px solid rgba(15,35,56,.16);
      box-shadow: 0 2px 8px rgba(11,32,58,.18); opacity: .72; transition: opacity .15s ease;
    }
    #asu3d-root .asu-label.is-active { opacity: 1; font-weight: 500; }
    #asu3d-root .asu-hint {
      position: absolute; left: 10px; bottom: 8px; color: #12395f;
      background: rgba(255,255,255,.72); border-radius: 6px; padding: 1px 7px;
    }
    #asu3d-root .asu-legend { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    #asu3d-root .asu-legend span.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    #asu3d-root .asu-info { display: grid; gap: 6px; }
    #asu3d-root .asu-info dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; }
    #asu3d-root .asu-info dt { color: var(--muted-foreground, #8b98ad); }
    #asu3d-root .asu-info dd { margin: 0; font-variant-numeric: tabular-nums; }
    #asu3d-root .asu-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    #asu3d-root .asu-tour { margin-left: auto; }
    @media (max-width: 560px) { #asu3d-root .asu-stage { aspect-ratio: 4 / 3; } #asu3d-root .asu-tour { margin-left: 0; } }
  </style>

  <div class="asu-title">
    <h2>空分装置工艺流程 · 3D</h2>
    <div class="asu-legend text-small text-muted">
      <span><span class="sw" style="background:#1f7ae0"></span>空气</span>
      <span><span class="sw" style="background:#12a86f"></span>氮气 / 污氮</span>
      <span><span class="sw" style="background:#e8a33d"></span>氧气</span>
      <span><span class="sw" style="background:#8a6bd8"></span>氩气</span>
      <span><span class="sw" style="background:#e2574c"></span>循环水</span>
      <span><span class="sw" style="background:#f2c200"></span>护栏</span>
    </div>
  </div>

  <div class="asu-stage">
    <canvas id="asu3d-canvas" role="img"
      aria-label="空分装置三维流程：空气过滤压缩、空冷塔和水冷塔预冷、分子筛纯化、净化空气进入冷箱主换热与膨胀制冷、精馏、低温储存与汽化、产品压缩外送"></canvas>
    <div class="asu-labels" id="asu3d-labels"></div>
    <div class="asu-hint text-small">拖拽旋转 · 滚轮缩放 · 点步骤看设备 · 巡游自动切镜头</div>
  </div>

  <div class="asu-bar">
    <div class="nav nav-pills" role="tablist" aria-label="工艺步骤" id="asu3d-steps" style="flex:1 1 auto"></div>
    <button class="nav-link asu-tour" id="asu3d-tour" type="button" aria-pressed="false">▶ 镜头巡游</button>
  </div>

  <div class="card" style="margin-top:12px">
    <div class="asu-info">
      <div class="text-small text-muted" id="asu3d-step-no">工艺步骤 1 / 7</div>
      <div id="asu3d-step-name" style="font-weight:500">空气过滤与压缩</div>
      <div class="text-small" id="asu3d-step-en" style="color:var(--muted-foreground,#8b98ad);letter-spacing:.06em"></div>
      <div class="text-small" id="asu3d-step-desc" style="color:var(--muted-foreground,#8b98ad)"></div>
      <dl class="text-small" id="asu3d-step-params"></dl>
    </div>
  </div>

  <script src="./assets/three.min.js"></script>
  <script>
  (function () {
    var root = document.getElementById('asu3d-root');
    if (!root) return;
    var canvas = root.querySelector('#asu3d-canvas');
    var labelsEl = root.querySelector('#asu3d-labels');
    var stepsEl = root.querySelector('#asu3d-steps');
    var tourBtn = root.querySelector('#asu3d-tour');
    var noEl = root.querySelector('#asu3d-step-no');
    var nameEl = root.querySelector('#asu3d-step-name');
    var enEl = root.querySelector('#asu3d-step-en');
    var descEl = root.querySelector('#asu3d-step-desc');
    var paramsEl = root.querySelector('#asu3d-step-params');

    var STEPS = [
      { label: '1 压缩', name: '空气过滤与压缩', en: 'CLEAN AIR COMPRESSION',
        desc: '自洁式过滤器与消音器把大气吸入离心空压机，多级压缩、级间冷却后送预冷系统。',
        params: [['空压机出口压力', '0.50 ~ 0.60 MPa'], ['出口温度', '≈ 35 ℃'], ['驱动方式', '电机 + 增速箱']] },
      { label: '2 预冷', name: '空冷塔 + 水冷塔', en: 'AIR COOLING & WATER COOLING TOWERS',
        desc: '压缩空气从空冷塔下部进入，与塔内喷淋水直接接触降温、洗涤；升温后的循环水进入水冷塔，与冷箱返流污氮逆流接触降温，再由循环水泵送回空冷塔。空冷塔顶部空气进入分子筛。',
        params: [['设备组成', '空冷塔 + 水冷塔 + 循环水泵'], ['空气路径', '空压机 → 空冷塔 → 分子筛'], ['水冷却介质', '冷箱返流污氮']] },
      { label: '3 纯化', name: '分子筛纯化', en: 'MOLECULAR SIEVE PURIFICATION',
        desc: '两只吸附器一用一再生，脱除水分、CO₂ 与乙炔等碳氢化合物，备用再生气电加热器。',
        params: [['吸附压力', '≈ 0.55 MPa'], ['切换周期', '约 4 h'], ['出口 CO₂', '< 1 ppm']] },
      { label: '4 冷箱换热', name: '冷箱主换热与膨胀制冷', en: 'COLD BOX / MAIN HEAT EXCHANGE & EXPANSION',
        desc: '分子筛净化后的空气进入冷箱，在板翅式主换热器内与返流气体换热降温；透平膨胀机提供精馏所需冷量。',
        params: [['主换热出口', '约 −170 ℃'], ['膨胀机进口', '−100 ~ −140 ℃'], ['冷量', '平衡装置冷损']] },
      { label: '5 精馏', name: '冷箱内精馏分离', en: 'DISTILLATION IN COLD BOX',
        desc: '冷箱内下塔初步分离、主冷提供回流液，上塔完成氧氮分离；中压气抽出送至氩系统。',
        params: [['下塔压力', '≈ 0.50 MPa'], ['上塔压力', '≈ 0.13 MPa'], ['氧纯度', '99.6 % O₂'], ['氮纯度', 'O₂ ≤ 10 ppm']] },
      { label: '6 储运', name: '低温储存与汽化', en: 'STORAGE & VAPORIZATION',
        desc: '液氧、液氮、液氩分别进入对应低温储罐；液氧可经水浴汽化后接入氧压机，液氩由低温泵送至槽车充装。',
        params: [['储罐', 'LOX / LIN / LAR 分罐存放'], ['液氧汽化', 'LOX 罐 → 水浴汽化器'], ['液氩装车', '低温泵 → 槽车']] },
      { label: '7 外送', name: '产品压缩与外送', en: 'PRODUCT COMPRESSION & DELIVERY',
        desc: '冷箱气氧、气氮分别进入氧压机和氮压机升压后并入产品管网；汽化后的液氧也可接入氧气外送线。',
        params: [['氧气管网', '1.6 ~ 3.0 MPa'], ['氮气管网', '0.8 ~ 2.5 MPa'], ['充装', '低温泵 + 槽车']] }
    ];

    /* 每个工序的镜头预设：目标点、方位角、俯仰角、距离 */
    var SHOTS = [
      { t: [-58, 12, -22], a: -0.44, p: 0.40, r: 138 },
      { t: [-37, 12, 4], a: -0.42, p: 0.42, r: 164 },
      { t: [-4, 16, 0], a: -0.36, p: 0.40, r: 140 },
      { t: [16, 17, 8], a: -0.48, p: 0.38, r: 136 },
      { t: [34, 24, 4], a: -0.54, p: 0.30, r: 134 },
      { t: [82, 15, 6], a: -0.46, p: 0.40, r: 176 },
      { t: [120, 13, -12], a: -0.48, p: 0.40, r: 158 }
    ];
    var OVERVIEW = { t: [28, 8, -2], a: -0.40, p: 0.44, r: 0 };

    function cssVar(n, f) {
      var v = getComputedStyle(root).getPropertyValue(n);
      return (v && v.trim()) || f;
    }

    function start() {
      if (!window.THREE) { setTimeout(start, 120); return; }
      var THREE = window.THREE;

      /* ---------- 渲染器：白天风格，透明背景透出 CSS 天空 ---------- */
      var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      var scene = new THREE.Scene();
      var camera = new THREE.PerspectiveCamera(34, 1, 0.5, 2400);
      var view = { t: new THREE.Vector3(28, 8, -2), a: OVERVIEW.a, p: OVERVIEW.p, r: 260, rFit: true };

      /* 环境反射：淡蓝天空 + 浅色地面 */
      var cvs = document.createElement('canvas');
      cvs.width = 8; cvs.height = 64;
      var cx2 = cvs.getContext('2d');
      var grad = cx2.createLinearGradient(0, 0, 0, 64);
      grad.addColorStop(0, '#6ba8e0');
      grad.addColorStop(0.55, '#dce9f5');
      grad.addColorStop(1, '#b9c3cc');
      cx2.fillStyle = grad; cx2.fillRect(0, 0, 8, 64);
      var envTex = new THREE.CanvasTexture(cvs);
      envTex.mapping = THREE.EquirectangularReflectionMapping;
      scene.environment = envTex;

      scene.add(new THREE.HemisphereLight(0xffffff, 0xb8c4cf, 0.72));
      var sun = new THREE.DirectionalLight(0xfff6e8, 1.5);
      sun.position.set(140, 200, 110);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      var sc = sun.shadow.camera;
      sc.left = -180; sc.right = 180; sc.top = 160; sc.bottom = -160; sc.near = 20; sc.far = 700;
      scene.add(sun);
      var fill = new THREE.DirectionalLight(0xdfeaf5, 0.45);
      fill.position.set(-150, 90, -140);
      scene.add(fill);

      /* ---------- 材质 ---------- */
      function M(hex, o) {
        o = o || {};
        return new THREE.MeshStandardMaterial({
          color: new THREE.Color(hex),
          metalness: o.m === undefined ? 0.25 : o.m,
          roughness: o.r === undefined ? 0.55 : o.r,
          transparent: o.op !== undefined, opacity: o.op === undefined ? 1 : o.op,
          side: o.side || THREE.FrontSide, emissive: new THREE.Color(0x000000)
        });
      }
      var CFG = {
        clad: M(0xf2f5f8, { m: 0.15, r: 0.62 }),        /* 冷箱彩钢外壁 */
        insul: M(0xe8edf2, { m: 0.30, r: 0.34 }),       /* 保温设备/管道 */
        steel: M(0xcfd6de, { m: 0.55, r: 0.38 }),       /* 不锈钢 */
        blue: M(0x1c4f86, { m: 0.35, r: 0.52 }),        /* 结构蓝 */
        blueDeep: M(0x163d69, { m: 0.35, r: 0.55 }),
        rail: M(0xf2c200, { m: 0.25, r: 0.50 }),        /* 黄色护栏 */
        concrete: M(0xc4cbd3, { m: 0.02, r: 0.94 }),
        apron: M(0xb0b8c1, { m: 0.02, r: 0.96 }),
        dark: M(0x6f7b88, { m: 0.45, r: 0.55 }),
        water: M(0x7fc4e8, { m: 0.1, r: 0.22, op: 0.72 }),
        glass: M(0x9fd0ee, { m: 0.1, r: 0.12, op: 0.5 }),
        vapor: M(0xffffff, { m: 0, r: 1, op: 0.30 }),
        air: M(0x1f7ae0, { m: 0.4, r: 0.45 }),
        n2: M(0x12a86f, { m: 0.4, r: 0.45 }),
        o2: M(0xe8a33d, { m: 0.4, r: 0.45 }),
        ar: M(0x8a6bd8, { m: 0.4, r: 0.45 }),
        cw: M(0xe2574c, { m: 0.4, r: 0.45 })
      };
      var MEDIA = { air: 0x1f7ae0, n2: 0x12a86f, o2: 0xe8a33d, ar: 0x8a6bd8, cw: 0xe2574c };

      var world = new THREE.Group();
      scene.add(world);
      var dimmable = [];
      var labels = [];
      var bubbles = [];
      var vapors = [];

      function tag(o, step) {
        o.userData.step = step;
        o.userData.baseOpacity = o.material && o.material.opacity !== undefined ? o.material.opacity : 1;
        dimmable.push(o);
        return o;
      }
      function add(parent, o, x, y, z, rx, ry, rz) {
        o.position.set(x || 0, y || 0, z || 0);
        if (rx) o.rotation.x = rx;
        if (ry) o.rotation.y = ry;
        if (rz) o.rotation.z = rz;
        o.castShadow = true; o.receiveShadow = true;
        parent.add(o);
        return o;
      }
      function box(w, h, d, m) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); }
      function cyl(rt, rb, h, m, seg) { return new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 22, 1, false), m); }
      function dome(r, m) { var s = new THREE.Mesh(new THREE.SphereGeometry(r, 22, 12), m); s.scale.y = 0.5; return s; }
      function ring(rt, rb, h, m, seg) { return new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 26, 1, true), m); }
      function label(text, x, y, z, step, small) {
        var el = document.createElement('div');
        el.className = 'asu-label' + (small ? ' text-small' : '');
        el.textContent = text;
        labelsEl.appendChild(el);
        labels.push({ el: el, pos: new THREE.Vector3(x, y, z), step: step });
      }

      /* 平台 + 黄色护栏 */
      function platform(g, w, d, y, m) {
        add(g, box(w, 0.5, d, m || CFG.concrete), 0, y, 0);
        var hw = w / 2 - 0.4, hd = d / 2 - 0.4, posts = Math.max(6, Math.round(w / 3));
        for (var i = 0; i < posts; i++) {
          var px = -hw + (2 * hw) * i / (posts - 1);
          add(g, box(0.14, 1.3, 0.14, CFG.rail), px, y + 0.9, hd);
          add(g, box(0.14, 1.3, 0.14, CFG.rail), px, y + 0.9, -hd);
        }
        var pd = Math.max(3, Math.round(d / 3));
        for (var k = 0; k < pd; k++) {
          var pz = -hd + (2 * hd) * k / (pd - 1);
          add(g, box(0.14, 1.3, 0.14, CFG.rail), hw, y + 0.9, pz);
          add(g, box(0.14, 1.3, 0.14, CFG.rail), -hw, y + 0.9, pz);
        }
        add(g, box(w, 0.12, 0.12, CFG.rail), 0, y + 1.5, hd);
        add(g, box(w, 0.12, 0.12, CFG.rail), 0, y + 1.5, -hd);
        add(g, box(0.12, 0.12, d, CFG.rail), hw, y + 1.5, 0);
        add(g, box(0.12, 0.12, d, CFG.rail), -hw, y + 1.5, 0);
      }

      /* 立式塔器：裙座 + 筒体 + 上下封头 + 平台 + 直梯 */
      function vessel(step, x, z, r, h, m, name, labelY) {
        var g = new THREE.Group(); g.position.set(x, 0, z); world.add(g);
        add(g, cyl(r * 0.92, r * 0.98, 4, CFG.blueDeep), 0, 2, 0);
        add(g, cyl(r, r, h, m), 0, 4 + h / 2, 0);
        add(g, dome(r, m), 0, 4 + h, 0);
        add(g, dome(r, m), 0, 4, 0, Math.PI, 0, 0);
        var py = 4 + h * 0.62;
        add(g, ring(r + 1.9, r + 1.9, 0.22, CFG.steel, 28), 0, py, 0);
        for (var i = 0; i < 14; i++) {
          var a = i / 14 * Math.PI * 2;
          add(g, box(0.13, 1.2, 0.13, CFG.rail), Math.cos(a) * (r + 1.8), py + 0.75, Math.sin(a) * (r + 1.8));
        }
        add(g, ring(r + 1.8, r + 1.8, 0.1, CFG.rail, 28), 0, py + 1.38, 0);
        add(g, box(0.14, h * 0.75, 0.14, CFG.steel), r + 0.9, 4 + h * 0.38, 0);
        add(g, box(0.14, h * 0.75, 0.14, CFG.steel), r + 0.9, 4 + h * 0.38, 1.0);
        g.traverse(function (o) { if (o.isMesh) tag(o, step); });
        if (name) label(name, x, labelY || (4 + h + r + 6), z, step);

        add(c, box(28, 3.4, 0.4, CFG.glass), 0, 5.6, -7.2);
        c.traverse(function (o) { if (o.isMesh) tag(o, 0); });
        label('DCS 控制室', 76, 13, 54, 0, true);
      })();

      /* ---------- 管廊（蓝色钢结构 + 保温管） ---------- */
      (function () {
        var rack = new THREE.Group(); world.add(rack);
        var x0 = -84, x1 = 136, z = -46;
        for (var x = x0; x <= x1; x += 16) {
          add(rack, box(1.1, 18, 1.1, CFG.blue), x, 9, z - 3.2);
          add(rack, box(1.1, 18, 1.1, CFG.blue), x, 9, z + 3.2);
          add(rack, box(1.0, 0.7, 8, CFG.blue), x, 17.6, z);
          add(rack, box(1.0, 0.6, 8, CFG.blue), x, 13.2, z);
          add(rack, box(1.0, 0.6, 8, CFG.blue), x, 8.8, z);
          add(rack, box(8, 0.12, 0.12, CFG.rail), x + 8, 18.4, z - 4);
        }
        add(rack, box(x1 - x0, 0.4, 8, CFG.blue), (x0 + x1) / 2, 18.1, z);
        function line(mat, y, zz, r) {
          add(rack, cyl(r, r, x1 - x0, mat, 16), (x0 + x1) / 2, y, z + zz, 0, 0, Math.PI / 2);
          for (var fx = x0 + 10; fx < x1; fx += 34) add(rack, cyl(r * 1.28, r * 1.28, 0.5, CFG.steel, 16), fx, y, z + zz, 0, 0, Math.PI / 2);
        }
        line(CFG.insul, 14.2, -1.9, 1.05);
        line(CFG.n2, 14.2, 1.9, 0.75);
        line(CFG.o2, 9.9, -1.6, 0.7);
        line(CFG.air, 19.1, 0, 1.15);
        rack.traverse(function (o) { if (o.isMesh) tag(o, 0); });
        label('工艺管廊', 6, 22, -46, 0, true);
      })();

      /* ---------- 管线与流动 ---------- */
      var flows = [];
      function pipe(points, color, r, speed, n) {
        var curve = new THREE.CatmullRomCurve3(points.map(function (p) { return new THREE.Vector3(p[0], p[1], p[2]); }));
        var tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 140, r, 12, false), M(color, { m: 0.45, r: 0.35 }));
        tube.castShadow = true; tube.userData.noDim = true; world.add(tube);
        var dotMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(color) });
        var dots = [];
        for (var i = 0; i < (n || 5); i++) {
          var d = new THREE.Mesh(new THREE.SphereGeometry(r * 1.15, 8, 6), dotMat);
          d.userData.noDim = true; world.add(d);
          dots.push({ mesh: d, t: i / (n || 5) });
        }
        flows.push({ curve: curve, dots: dots, speed: speed });
      }
      pipe([[-68, 12, -24], [-52, 13, -24], [-34, 13, -24]], MEDIA.air, 1.5, 0.075, 4);
      /* 压缩空气：空压机 → 空冷塔 → 双床分子筛 → 冷箱主换热器。 */
      pipe([[-34, 13, -24], [-32, 13, -24], [-31, 9, -24], [-21, 8, -24]], MEDIA.air, 1.25, 0.075, 4);
      pipe([[-28, 33, -24], [-22, 33, -24], [-16, 31, -24], [-13, 29, -24], [-13, 8, -24]], MEDIA.air, 1.05, 0.075, 5);
      pipe([[-13, 8, -24], [-13, 8, -16], [-9.2, 8, -16]], MEDIA.air, 0.95, 0.075, 3);
      pipe([[-13, 8, -16], [-13, 8, -3], [-13, 8, 10]], MEDIA.air, 0.85, 0.075, 4);
      pipe([[-13, 8, 10], [-9.2, 8, 10]], MEDIA.air, 0.95, 0.075, 3);
      pipe([[-4, 27, -16], [1.5, 27, -16], [7, 29, -16]], MEDIA.air, 1.0, 0.075, 3);
      pipe([[-4, 27, 10], [1.5, 27, 10], [7, 29, 10]], MEDIA.air, 1.0, 0.075, 3);
      pipe([[7, 29, -16], [7, 29, -3], [7, 29, 10]], MEDIA.air, 0.9, 0.075, 4);
      pipe([[7, 29, -3], [14, 29, -3], [16, 26, -3], [16, 16, -3], [24, 16, -7]], MEDIA.air, 1.15, 0.075, 5);
      /* 循环水：水冷塔底部 → 循环水泵组 → 空冷塔顶部；空冷塔回水到水冷塔。 */
      pipe([[-48, 2, 30], [-38, 3, 36], [-26, 3, 40], [-15, 3, 40]], MEDIA.cw, 0.85, 0.055, 4);
      pipe([[-15, 2.1, 40.3], [-15, 13, 32], [-19, 21, 10], [-24, 29, -8], [-28, 34, -24]], MEDIA.cw, 0.8, 0.055, 5);
      pipe([[-21, 3, -24], [-23, 3, -10], [-35, 3, -10], [-44, 3, 6], [-48, 14, 22], [-48, 23, 30]], MEDIA.cw, 0.8, 0.05, 5);
      pipe([[20, 10, 12], [12, 9, 32], [4, 9, 50], [-24, 9, 52], [-58, 9, 52], [-66, 8, 42], [-66, 6, 30], [-56, 6, 30], [-50, 7, 30], [-48, 11, 30], [-48, 20, 30], [-48, 26, 30], [-48, 34, 30], [-62, 37, 30]], MEDIA.n2, 0.7, 0.045, 9);
      label('污氮进塔冷却循环水，塔顶排空', -64, 27, 30, 1, true);
      /* 液体产品分别入罐；气体产品绕过储罐，单独送产品压缩厂房。 */
      pipe([[42, 10, -8], [50, 10, -18], [64, 10, -20], [74, 11, -24], [80.6, 14, -30]], MEDIA.o2, 0.9, 0.06, 5);
      pipe([[42, 10, 0], [52, 10, 8], [66, 10, 9], [76, 12, 5], [80.6, 14, 0]], MEDIA.n2, 0.9, 0.06, 5);
      pipe([[48, 18, 14], [62, 16, 20], [74, 14, 27], [82.4, 12, 30]], MEDIA.ar, 0.9, 0.065, 4);
      pipe([[93.6, 10, 30], [100, 10, 32], [110, 9, 30]], MEDIA.ar, 0.85, 0.065, 3);
      pipe([[48, 24, -9], [60, 30, -15], [74, 39, -26], [98, 41, -34], [108, 22, -34], [110, 8, -30], [118, 7, -30]], MEDIA.o2, 0.9, 0.07, 6);
      pipe([[48, 30, 9], [60, 35, 13], [78, 43, 13], [98, 43, 0], [108, 22, -14], [110, 7, -22], [118, 7, -22]], MEDIA.n2, 0.9, 0.07, 6);
      /* LOX 储罐 → 水浴汽化器 → 氧压机，作为液氧汽化外送线。 */
      pipe([[80.6, 14, -30], [75, 12, -30], [70.5, 10, -30]], MEDIA.o2, 0.8, 0.06, 3);
      pipe([[70.5, 13, -30], [76, 13, -40], [97, 13, -40], [108, 10, -34], [110, 8, -30], [118, 7, -30]], MEDIA.o2, 0.8, 0.06, 5);
      /* 产品压缩机出口接入公用管廊，分别送氧气与氮气用户管网。 */
      pipe([[126, 7, -30], [135, 8, -30], [141, 10, -34], [141, 15, -40], [134, 9.9, -47.6]], MEDIA.o2, 0.85, 0.065, 5);
      pipe([[126, 7, -22], [135, 6, -22], [141, 9, -27], [141, 15, -35], [134, 14.2, -44.1]], MEDIA.n2, 0.85, 0.065, 5);

      /* ---------- 交互 ---------- */
      var stepButtons = [];
      STEPS.forEach(function (s, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'nav-link' + (i === 0 ? ' active' : '');
        b.setAttribute('role', 'tab');
        b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
        b.textContent = s.label;
        b.addEventListener('click', function () { stopTour(); select(i); flyTo(i); });
        stepsEl.appendChild(b);
        stepButtons.push(b);
      });

      var current = 0;
      function select(i) {
        current = i;
        stepButtons.forEach(function (b, k) {
          b.classList.toggle('active', k === i);
          b.setAttribute('aria-selected', k === i ? 'true' : 'false');
        });
        var s = STEPS[i];
        noEl.textContent = '工艺步骤 ' + (i + 1) + ' / ' + STEPS.length;
        nameEl.textContent = s.name;
        enEl.textContent = s.en;
        descEl.textContent = s.desc;
        paramsEl.innerHTML = s.params.map(function (p) { return '<dt>' + p[0] + '</dt><dd>' + p[1] + '</dd>'; }).join('');
      }

      /* ---------- 镜头：自动取景 + 巡游 ---------- */
      var goal = { t: new THREE.Vector3(28, 8, -2), a: OVERVIEW.a, p: OVERVIEW.p, r: 260 };
      var follow = false, touring = false, tourTimer = 0, hop = 0;

      function fitDistance() {
        var spanX = 302, spanY = 168;
        var vFov = camera.fov * Math.PI / 180;
        var hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
        return Math.max((spanX / 2) / Math.tan(hFov / 2), (spanY / 2) / Math.tan(vFov / 2)) * 0.95;
      }
      function flyTo(i) {
        var s = SHOTS[i];
        goal.t.set(s.t[0], s.t[1], s.t[2]);
        goal.a = s.a; goal.p = s.p; goal.r = s.r;
        follow = true; hop = 1;
      }
      function flyOverview() {
        goal.t.set(OVERVIEW.t[0], OVERVIEW.t[1], OVERVIEW.t[2]);
        goal.a = OVERVIEW.a; goal.p = OVERVIEW.p; goal.r = fitDistance();
        follow = true; hop = 1;
      }
      function startTour() {
        touring = true; tourTimer = 0;
        tourBtn.setAttribute('aria-pressed', 'true');
        tourBtn.textContent = '■ 停止巡游';
        select(0); flyTo(0);
      }
      function stopTour() {
        if (!touring) return;
        touring = false;
        tourBtn.setAttribute('aria-pressed', 'false');
        tourBtn.textContent = '▶ 镜头巡游';
      }
      tourBtn.addEventListener('click', function () { touring ? stopTour() : startTour(); });

      function project(v) {
        var p = v.clone().project(camera);
        return { x: (p.x * 0.5 + 0.5) * canvas.clientWidth, y: (-p.y * 0.5 + 0.5) * canvas.clientHeight };
      }

      var dragging = false, lx = 0, ly = 0;
      canvas.addEventListener('pointerdown', function (e) {
        dragging = true; lx = e.clientX; ly = e.clientY;
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener('pointerup', function (e) {
        dragging = false; try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
      });
      canvas.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        stopTour(); follow = false;
        hop = 0;
        view.a -= (e.clientX - lx) * 0.005;
        view.p = Math.max(0.05, Math.min(1.2, view.p + (e.clientY - ly) * 0.0035));
        goal.a = view.a; goal.p = view.p;
        lx = e.clientX; ly = e.clientY;
      });
      canvas.addEventListener('wheel', function (e) {
        e.preventDefault();
        stopTour(); follow = false;
        hop = 0;
        view.r = Math.max(60, Math.min(600, view.r + e.deltaY * 0.22));
        goal.r = view.r;
      }, { passive: false });

      function resize() {
        var w = canvas.clientWidth || 640, h = canvas.clientHeight || 400;
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        if (!follow) { goal.r = fitDistance(); view.r = goal.r; }
      }
      if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
      window.addEventListener('resize', resize);

      var clock = new THREE.Clock();
      function frame() {
        try { frameBody(); }
        catch (err) {
          var hintEl = root.querySelector('.asu-hint');
          if (hintEl) hintEl.textContent = '渲染错误: ' + (err && err.message ? err.message : err);
          requestAnimationFrame(frame);
        }
      }
      function frameBody() {
        var dt = Math.min(clock.getDelta(), 0.05);
        /* 巡游推进 */
        if (touring) {
          tourTimer += dt;
          if (tourTimer > 6.5) {
            if (current < STEPS.length - 1) { select(current + 1); flyTo(current + 1); }
            else { stopTour(); }
            tourTimer = 0;
          }
        }
        /* 平滑跟随目标镜头 */
        if (follow) {
          var k = 1 - Math.exp(-2.6 * dt);
          view.t.lerp(goal.t, k);
          view.a += (goal.a - view.a) * k;
          view.p += (goal.p - view.p) * k;
          view.r += (goal.r - view.r) * k;
          if (view.t.distanceTo(goal.t) < 0.6 && Math.abs(goal.r - view.r) < 1.5) follow = false;
        }
        camera.position.set(
          view.t.x + view.r * Math.cos(view.p) * Math.sin(view.a),
          view.t.y + view.r * Math.sin(view.p) + hop * 22,
          view.t.z + view.r * Math.cos(view.p) * Math.cos(view.a)
        );
        hop *= Math.exp(-1.7 * dt);
        camera.lookAt(view.t);

        /* 高亮当前工序 */
        dimmable.forEach(function (m) {
          if (m.userData.noDim) return;
          var on = m.userData.step === current;
          var base = m.userData.baseOpacity === undefined ? 1 : m.userData.baseOpacity;
          m.material.transparent = true;
          m.material.opacity = on ? base : Math.min(base, 0.62);
          if (m.material.emissive) {
            m.material.emissive.setHex(on ? 0x0a2a4a : 0x000000);
            m.material.emissiveIntensity = on ? 0.06 : 0;
          }
        });
        /* 流动、气泡、蒸气 */
        flows.forEach(function (f) {
          f.dots.forEach(function (d) {
            d.t = (d.t + dt * f.speed) % 1;
            d.mesh.position.copy(f.curve.getPointAt(d.t));
          });
        });
        var tm = performance.now() / 1000;
        bubbles.forEach(function (b) {
          var p = (tm * 0.5 + b.phase) % 1;
          b.mesh.position.y = b.y0 - p * 3.6;
          b.mesh.material.opacity = 0.75 * (1 - p);
        });
        vapors.forEach(function (v2) {
          var p = (tm * 0.22 + v2.phase) % 1;
          v2.mesh.position.y = v2.y0 + p * 9;
          v2.mesh.scale.setScalar(0.7 + p * 0.9);
          v2.mesh.material.opacity = 0.30 * (1 - p);
        });
        /* 标签 */
        var w = canvas.clientWidth, h = canvas.clientHeight;
        labels.forEach(function (L) {
          var pt = project(L.pos);
          L.el.style.left = Math.max(36, Math.min(w - 36, pt.x)) + 'px';
          L.el.style.top = Math.max(18, Math.min(h - 22, pt.y)) + 'px';
          var on = (L.step === current) || L.always;
          L.el.style.display = on ? '' : 'none';
          L.el.classList.toggle('is-active', L.step === current);
        });
        renderer.render(scene, camera);
        requestAnimationFrame(frame);
      }

      resize();
      select(0);
      flyOverview();
      frame();
      /* 调试用：暴露相机状态（不影响正常使用） */
      window.__asu = {
        state: function () {
          return {
            r: +view.r.toFixed(1), gr: +goal.r.toFixed(1),
            t: [+view.t.x.toFixed(1), +view.t.y.toFixed(1), +view.t.z.toFixed(1)],
            gt: [+goal.t.x.toFixed(1), +goal.t.y.toFixed(1), +goal.t.z.toFixed(1)],
            follow: follow, touring: touring, current: current
          };
        }
      };
    }
    start();
  })();
  </script>
</div>

  </div>
  <div class="foot">底图与参数为工艺流程示意（典型值），不构成工程设计依据。 · 曼城十号梅西</div>
