<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>工作日志 · 每日计划 · 曼城十号梅西</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%235b8cff'/><stop offset='1' stop-color='%23f0b90b'/></linearGradient></defs><rect width='100' height='100' rx='26' fill='url(%23g)'/><path d='M22 62 L40 44 L54 56 L78 32' stroke='white' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
  :root{
    --bg:#080b12;
    --panel:#0e1420;
    --panel2:#131b2a;
    --line:#1d2637;
    --line2:#26314a;
    --ink:#e9eff9;
    --ink2:#98a7bf;
    --ink3:#66748d;
    --ok:#2ebd85;
    --gold:#f0b90b;
    --accent:#5b8cff;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;
    background:
      radial-gradient(1100px 560px at 12% -12%, rgba(91,140,255,.12), transparent 62%),
      radial-gradient(900px 480px at 92% -6%, rgba(240,185,11,.07), transparent 58%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.6;
  }
  .wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 24px 56px}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* ---------- 顶栏 ---------- */
  .top{position:sticky;top:0;z-index:40;background:rgba(8,11,18,.82);
    backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
    border-bottom:1px solid var(--line)}
  .top-inner{display:flex;align-items:center;justify-content:space-between;gap:24px;
    max-width:1080px;margin:0 auto;min-height:76px;padding:14px 24px;flex-wrap:wrap}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;
    color:var(--ink3);margin-bottom:6px;transition:color .18s ease}
  .back:hover{color:var(--ink2)}
  .brand-tag{font-size:11.5px;letter-spacing:.22em;font-weight:700;
    background:linear-gradient(90deg,#5b8cff,#f0b90b);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .brand h1{font-size:21px;font-weight:700;letter-spacing:.01em;margin-top:2px}
  .status{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .conn{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2)}
  .conn i{width:7px;height:7px;border-radius:50%;background:var(--accent);
    box-shadow:0 0 0 4px rgba(91,140,255,.15)}
  .conn.ok i{background:var(--ok);box-shadow:0 0 0 4px rgba(46,189,133,.15)}
  .conn.bad{color:#e8a33d}
  .conn.bad i{background:#e8a33d;box-shadow:0 0 0 4px rgba(232,163,61,.15)}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:11px;
    border:1px solid var(--line2);background:var(--panel2);color:var(--ink);
    font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;
    transition:transform .18s ease,border-color .18s ease,background .18s ease}
  .btn:hover{transform:translateY(-1px);border-color:#33405f;background:#182238}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:linear-gradient(135deg,#2f5bd0,#5b8cff);border-color:#4a76e0;color:#fff}
  .btn.primary:hover{background:linear-gradient(135deg,#3a67dd,#6a97ff)}
  .btn.ghost{background:transparent}
  .btn.gold{background:linear-gradient(135deg,#c9970a,#f0b90b);border-color:#d8a90d;color:#241a00}
  .btn.gold:hover{background:linear-gradient(135deg,#d9a410,#ffc61a)}

  /* ---------- 日期条 ---------- */
  .daybar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:26px 0 16px}
  .dnav{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);
    background:var(--panel2);color:var(--ink2);font-size:17px;cursor:pointer;font-family:inherit;
    display:inline-flex;align-items:center;justify-content:center;transition:all .18s ease}
  .dnav:hover{color:var(--ink);border-color:#33405f}
  input[type="date"]{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);
    border-radius:10px;padding:8px 12px;font-size:13.5px;font-family:inherit;color-scheme:dark}
  .dlabel{font-size:13px;color:var(--ink3)}
  .dtag{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);
    color:var(--ink2);background:var(--panel)}
  .dtag.today{color:#0b1017;background:var(--gold);border-color:var(--gold);font-weight:700}

  /* ---------- 面板 ---------- */
  .panel{background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
  .panel h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px}
  .panel h3 .cnt{font-size:12.5px;font-weight:500;color:var(--ink3)}
  .panel h3 .sp{flex:1}
  .panel h3 .icon{width:26px;height:26px;border-radius:8px;display:inline-flex;
    align-items:center;justify-content:center;font-size:14px;
    background:rgba(91,140,255,.14);color:var(--accent)}
  .panel.arch h3 .icon{background:rgba(46,189,133,.14);color:var(--ok)}

  .addrow{display:flex;gap:10px;margin:14px 0 6px}
  .addrow input{flex:1;background:#0b111c;border:1px solid var(--line2);color:var(--ink);
    border-radius:11px;padding:11px 14px;font-size:14px;font-family:inherit;outline:none;
    transition:border-color .18s ease}
  .addrow input:focus{border-color:#3f5a92}

  .list{margin-top:8px}
  .item{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:11px;
    transition:background .15s ease}
  .item:hover{background:rgba(255,255,255,.025)}
  .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);
    background:transparent;cursor:pointer;flex:none;position:relative;transition:all .18s ease}
  .tick:hover{border-color:var(--ok)}
  .item.done .tick{background:var(--ok);border-color:var(--ok)}
  .item.done .tick::after{content:"";position:absolute;left:6.5px;top:3px;width:5px;height:9px;
    border:solid #06120c;border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
  .item input.txt{flex:1;background:transparent;border:none;color:var(--ink);
    font-size:14.5px;font-family:inherit;outline:none;padding:2px 0;min-width:0}
  .item input.txt:focus{background:#0b111c;border-radius:8px;padding:2px 8px;
    box-shadow:0 0 0 1px var(--line2)}
  .item.done input.txt{color:var(--ink3);text-decoration:line-through}
  .item .from{flex:none;font-size:11.5px;color:var(--gold);
    border:1px solid rgba(240,185,11,.34);background:rgba(240,185,11,.10);
    padding:1px 8px;border-radius:999px}
  .item .time{font-size:12px;color:var(--ink3);flex:none}
  .item .del{flex:none;width:26px;height:26px;border-radius:8px;border:none;background:transparent;
    color:var(--ink3);cursor:pointer;font-size:14px;opacity:0;transition:all .15s ease;font-family:inherit}
  .item:hover .del{opacity:1}
  .item .del:hover{background:rgba(246,70,93,.14);color:#f6465d}
  @media (hover:none){ .item .del{opacity:.7} }

  .empty{color:var(--ink3);font-size:13.5px;padding:14px 6px;text-align:center}

  /* ---------- 布布与一二：待办越少，靠得越近 ---------- */
  .bears{margin:14px 0 2px;padding:12px 14px 10px;border-radius:14px;position:relative;overflow:hidden;
    background:
      radial-gradient(120% 170% at 10% 0%, rgba(240,185,11,.09), transparent 58%),
      radial-gradient(110% 150% at 92% 10%, rgba(91,140,255,.10), transparent 60%),
      linear-gradient(180deg,#101827,#0d1320);
    border:1px solid var(--line)}
  .bear-track{position:relative;height:70px}
  .bear{position:absolute;left:0;bottom:0;width:64px;height:64px}
  .bear .inner{width:100%;height:100%}
  .bear.bu{transform:translateX(170px);transition:transform .9s cubic-bezier(.34,1.28,.5,1)}
  .bear .inner{transform-origin:50% 88%}
  .bears.hug .bear.one .inner{animation:bearSway 1.5s ease-in-out infinite}
  .bears.hug .bear.bu .inner{animation:bearSway 1.5s ease-in-out infinite .22s}
  @keyframes bearSway{
    0%,100%{transform:rotate(-3deg) translateY(0)}
    50%{transform:rotate(3deg) translateY(-3px)}
  }
  .hearts{position:absolute;left:56px;bottom:60px;pointer-events:none}
  .heart{position:absolute;font-size:14px;opacity:0;animation:heartUp 1.9s ease-out forwards}
  @keyframes heartUp{
    0%{opacity:0;transform:translate(0,0) scale(.5)}
    22%{opacity:1}
    100%{opacity:0;transform:translate(var(--hx,8px),-46px) scale(1.1)}
  }
  .bear-note{margin-top:8px;font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:6px;min-height:19px}
  .bear-note b{color:var(--ink2);font-weight:600}

  /* ---------- 归档 ---------- */
  .agroup{margin-top:12px}
  .agroup .ghead{font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:8px;
    padding:4px 6px 6px}
  .agroup .ghead b{color:var(--ink2);font-weight:600}
  .agroup .ghead .line{flex:1;height:1px;background:var(--line)}
  .aitem{display:flex;align-items:center;gap:12px;padding:7px 6px;border-radius:10px}
  .aitem:hover{background:rgba(255,255,255,.025)}
  .aitem .ok{flex:none;width:18px;height:18px;border-radius:50%;background:rgba(46,189,133,.16);
    color:var(--ok);display:inline-flex;align-items:center;justify-content:center;font-size:11px}
  .aitem .t{flex:1;font-size:14px;color:var(--ink2)}
  .aitem .time{font-size:12px;color:var(--ink3);flex:none}
  .aitem .undo{flex:none;font-size:12px;color:var(--ink3);background:transparent;border:1px solid var(--line2);
    border-radius:8px;padding:3px 9px;cursor:pointer;font-family:inherit;transition:all .15s ease}
  .aitem .undo:hover{color:var(--ink);border-color:#33405f}

  /* ---------- toast ---------- */
  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);
    background:#16203a;border:1px solid var(--line2);color:var(--ink);
    padding:10px 18px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;
    transition:all .25s ease;z-index:90;box-shadow:0 12px 32px rgba(0,0,0,.4)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:720px){
    .wrap{padding:0 14px 48px}
    .top-inner{padding:12px 14px}
    .brand h1{font-size:18px}
    .panel{padding:14px}
  }
</style>
</head>
<body>

<div class="top">
  <div class="top-inner">
    <div>
      <a class="back" href="./home3.html">&#8592; 曼城十号梅西</a>
      <div class="brand">
        <div class="brand-tag">DAILY WORK LOG</div>
        <h1>工作日志 · 每日计划</h1>
      </div>
    </div>
    <div class="status">
      <span class="conn" id="conn"><i></i><span id="connTxt">加载中…</span></span>
      <button class="btn gold" id="exportBtn">导出 Excel</button>
    </div>
  </div>
</div>

<main class="wrap">

  <div class="daybar">
    <button class="dnav" id="prevDay" title="前一天">&#8249;</button>
    <input type="date" id="dayInput">
    <button class="dnav" id="nextDay" title="后一天">&#8250;</button>
    <button class="btn ghost" id="todayBtn">回到今天</button>
    <span class="dtag" id="dTag">今天</span>
    <span class="dlabel" id="dLabel"></span>
  </div>

  <section class="panel">
    <h3><span class="icon">&#9998;</span>计划<span class="cnt" id="planCnt"></span></h3>

    <div class="bears" id="bears">
      <div class="bear-track" id="bearTrack">
        <div class="bear one"><div class="inner"><svg viewBox="0 0 100 100" width="64" height="64" aria-hidden="true">
          <circle cx="26" cy="26" r="13" fill="#2b2b2b"/>
          <circle cx="74" cy="26" r="13" fill="#2b2b2b"/>
          <ellipse cx="50" cy="57" rx="34" ry="31" fill="#ffffff"/>
          <ellipse cx="38" cy="53" rx="7.2" ry="8.2" fill="#2b2b2b"/>
          <ellipse cx="62" cy="53" rx="7.2" ry="8.2" fill="#2b2b2b"/>
          <circle cx="39.6" cy="50.8" r="2.5" fill="#ffffff"/>
          <circle cx="63.6" cy="50.8" r="2.5" fill="#ffffff"/>
          <ellipse cx="50" cy="65" rx="4.2" ry="3.2" fill="#2b2b2b"/>
          <circle cx="27" cy="65" r="5" fill="#ffb3c1" opacity=".85"/>
          <circle cx="73" cy="65" r="5" fill="#ffb3c1" opacity=".85"/>
          <g transform="translate(50,17)">
            <path d="M0 0 L-11 -7 L-11 7 Z" fill="#2b2b2b"/>
            <path d="M0 0 L11 -7 L11 7 Z" fill="#2b2b2b"/>
            <circle cx="0" cy="0" r="3.2" fill="#2b2b2b"/>
          </g>
        </svg></div></div>
        <div class="bear bu" id="bearBu"><div class="inner"><svg viewBox="0 0 100 100" width="64" height="64" aria-hidden="true">
          <circle cx="25" cy="28" r="13" fill="#a9764e"/>
          <circle cx="75" cy="28" r="13" fill="#a9764e"/>
          <circle cx="25" cy="28" r="6.6" fill="#c99a76" opacity=".75"/>
          <circle cx="75" cy="28" r="6.6" fill="#c99a76" opacity=".75"/>
          <ellipse cx="50" cy="57" rx="34" ry="31" fill="#b58057"/>
          <ellipse cx="50" cy="67" rx="16" ry="11.5" fill="#dcbb98"/>
          <circle cx="38" cy="53" r="4.3" fill="#3a2b20"/>
          <circle cx="62" cy="53" r="4.3" fill="#3a2b20"/>
          <circle cx="39.4" cy="51.6" r="1.5" fill="#ffffff"/>
          <circle cx="63.4" cy="51.6" r="1.5" fill="#ffffff"/>
          <ellipse cx="50" cy="62" rx="4.6" ry="3.4" fill="#3a2b20"/>
          <path d="M44 69 Q50 74 56 69" stroke="#3a2b20" stroke-width="2" fill="none" stroke-linecap="round"/>
          <circle cx="26" cy="65" r="5" fill="#e8938a" opacity=".5"/>
          <circle cx="74" cy="65" r="5" fill="#e8938a" opacity=".5"/>
        </svg></div></div>
        <div class="hearts" id="hearts"></div>
      </div>
      <div class="bear-note" id="bearNote"></div>
    </div>

    <div class="addrow">
      <input id="newItem" placeholder="写一项今天要做的事，回车添加…" autocomplete="off">
      <button class="btn primary" id="addBtn">添加</button>
    </div>
    <div class="list" id="planList"></div>
  </section>

  <section class="panel arch">
    <h3><span class="icon">&#10003;</span>已完成归档<span class="cnt" id="archCnt"></span><span class="sp"></span></h3>
    <div id="archList"></div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script src="./assets/workbuddy-cloud-sdk.js"></script>
<script src="./assets/wb-cloud-v2.js"></script>
<script>
(function () {
  "use strict";

  var LS = "work-cache-v1";
  var days = {};
  var selDay = "";
  var cloudOk = false;

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function dstr(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayStr() { return dstr(new Date()); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function hhmm(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function wdText(day) {
    var p = day.split("-");
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return "周" + ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
  }

  /* ---------- 缓存 ---------- */
  function readCache() {
    try { return JSON.parse(localStorage.getItem(LS) || "{}") || {}; } catch (e) { return {}; }
  }
  function writeCache() {
    try { localStorage.setItem(LS, JSON.stringify(days)); } catch (e) {}
  }

  /* ---------- 云端 ---------- */
  function setConn(cls, txt) {
    var el = document.getElementById("conn");
    el.className = "conn" + (cls ? " " + cls : "");
    document.getElementById("connTxt").textContent = txt;
  }
  function absorbCloud() {
    if (!window.WB || !WB.ready) return;
    for (var k in WB.data) {
      if (k.indexOf("work:") === 0) {
        var arr = WB.data[k];
        if (arr && arr.length !== undefined) days[k.slice(5)] = arr;
      }
    }
    cloudOk = !WB.error;
    writeCache();
  }
  function saveDay(day) {
    writeCache();
    if (window.WB) {
      WB.putSafe("work:" + day, days[day] || []).then(function () {
        setConn("ok", "已同步到云端");
      }).catch(function () {});
    }
  }
  function arrOf(day) {
    if (!days[day]) days[day] = [];
    return days[day];
  }

  /* ---------- toast ---------- */
  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("on"); }, 2600);
  }

  /* ---------- 渲染 ---------- */
  function renderDay() {
    var di = document.getElementById("dayInput");
    di.value = selDay;
    var t = todayStr();
    var tag = document.getElementById("dTag");
    if (selDay === t) { tag.textContent = "今天"; tag.className = "dtag today"; }
    else { tag.textContent = wdText(selDay); tag.className = "dtag"; }
    document.getElementById("dLabel").textContent = selDay + " · " + wdText(selDay);
  }

  function renderPlan() {
    var a = arrOf(selDay);
    var todo = a.filter(function (it) { return !it.d; });
    var box = document.getElementById("planList");
    var cnt = document.getElementById("planCnt");
    cnt.textContent = a.length ? ("待办 " + todo.length + " / 共 " + a.length) : "";
    if (!todo.length) {
      box.innerHTML = '<div class="empty">' +
        (a.length ? "这一天的计划都完成啦，去下方归档区查看 🎉" : "还没有计划，在上方输入框写第一条吧") +
        '</div>';
      return;
    }
    todo.sort(function (a, b) { return (a.c || 0) - (b.c || 0); });
    var html = "";
    todo.forEach(function (it) {
      var from = (it.from && it.from < selDay) ?
        '<span class="from" title="' + it.from + ' 未完成，已自动顺延">' +
        it.from.slice(5).replace("-", "/") + '</span>' : '';
      html += '<div class="item" data-id="' + it.id + '">' +
        '<button class="tick" title="完成并归档"></button>' +
        '<input class="txt" value="' + esc(it.t) + '" placeholder="（空）">' +
        from +
        '<button class="del" title="删除">&#10005;</button>' +
        '</div>';
    });
    box.innerHTML = html;
  }

  function renderArch() {
    var groups = [];
    Object.keys(days).sort().reverse().forEach(function (day) {
      var dones = (days[day] || []).filter(function (it) { return it && it.d; });
      if (dones.length) groups.push({ day: day, items: dones });
    });
    var box = document.getElementById("archList");
    var cnt = document.getElementById("archCnt");
    var total = groups.reduce(function (a, g) { return a + g.items.length; }, 0);
    cnt.textContent = total ? (total + " 项") : "";
    if (!groups.length) {
      box.innerHTML = '<div class="empty">完成计划后会自动归档到这里</div>';
      return;
    }
    var html = "";
    groups.forEach(function (g) {
      html += '<div class="agroup"><div class="ghead"><b>' + g.day + '</b><span>' + wdText(g.day) +
        ' · ' + g.items.length + ' 项</span><span class="line"></span></div>';
      g.items.forEach(function (it) {
        html += '<div class="aitem" data-id="' + it.id + '" data-day="' + g.day + '">' +
          '<span class="ok">&#10003;</span>' +
          '<span class="t">' + esc(it.t) + '</span>' +
          '<span class="time num">' + hhmm(it.da) + '</span>' +
          '<button class="undo" title="撤销完成，退回待办">撤销</button>' +
          '</div>';
      });
      html += '</div>';
    });
    box.innerHTML = html;
  }

  /* ---------- 布布 & 一二：待办越少靠得越近 ---------- */
  function renderBears() {
    var track = document.getElementById("bearTrack");
    var bu = document.getElementById("bearBu");
    var note = document.getElementById("bearNote");
    var box = document.getElementById("bears");
    if (!track || !bu || !note || !box) return;
    var a = arrOf(selDay);
    var total = a.length, todo = 0;
    for (var i = 0; i < a.length; i++) { if (a[i] && !a[i].d) todo++; }
    var maxX = Math.max(0, track.clientWidth - 70);
    var ratio = Math.min(todo, 6) / 6;
    bu.style.transform = "translateX(" + (ratio * maxX).toFixed(1) + "px)";
    var msg;
    if (total === 0) msg = "<b>新的一天</b> · 写下第一条计划吧";
    else if (todo === 0) msg = "<b>全部完成！</b>布布已经抱住一二啦 ❤";
    else if (todo === 1) msg = "就剩 <b>1 件</b>了，布布马上到！";
    else if (todo <= 3) msg = "还有 <b>" + todo + " 件</b>，布布小跑赶来…";
    else msg = "还有 <b>" + todo + " 件</b>，布布从远处出发…";
    note.innerHTML = msg;
    if (todo === 0 && total > 0) {
      if (!box.classList.contains("hug")) {
        box.classList.add("hug");
        spawnHearts();
      }
    } else {
      box.classList.remove("hug");
    }
  }
  function spawnHearts() {
    var h = document.getElementById("hearts");
    if (!h) return;
    h.innerHTML = "";
    var pos = [-8, 6, 18], colors = ["#ff9fb0", "#f6465d", "#ffc2cc"];
    for (var i = 0; i < 3; i++) {
      var s = document.createElement("span");
      s.className = "heart";
      s.textContent = "\u2764";
      s.style.left = (i * 13) + "px";
      s.style.color = colors[i];
      s.style.setProperty("--hx", pos[i] + "px");
      s.style.animationDelay = (i * 0.18) + "s";
      h.appendChild(s);
    }
  }

  function renderAll() {
    renderDay(); renderPlan(); renderArch(); renderBears();
  }

  /* ---------- 顺延：往日未完成自動累计到今天 ---------- */
  function rollover() {
    var today = todayStr();
    var moved = 0;
    Object.keys(days).slice().sort().forEach(function (day) {
      if (day >= today) return;
      var arr = days[day] || [];
      var keep = [], move = [];
      for (var i = 0; i < arr.length; i++) {
        var it = arr[i];
        if (it && !it.d) move.push(it); else keep.push(it);
      }
      if (!move.length) return;
      var ta = arrOf(today);
      move.forEach(function (it) {
        if (!it.from) it.from = day;
        var dup = false;
        for (var j = 0; j < ta.length; j++) { if (ta[j].id === it.id) { dup = true; break; } }
        if (!dup) ta.push(it);
      });
      days[day] = keep;
      saveDay(day);
      moved += move.length;
    });
    if (moved) {
      saveDay(today);
      toast("已把 " + moved + " 项未完成事项顺延到今天");
    }
  }

  /* ---------- 操作 ---------- */
  function addItem(text) {
    var t = String(text || "").trim();
    if (!t) return false;
    arrOf(selDay).push({ id: uid(), t: t, d: false, c: Date.now() });
    saveDay(selDay);
    renderAll();
    return true;
  }
  function toggleItem(id) {
    var a = arrOf(selDay), key = null;
    for (var i = 0; i < a.length; i++) {
      if (a[i].id === id) {
        a[i].d = !a[i].d;
        a[i].da = a[i].d ? Date.now() : null;
        key = a[i].t;
        break;
      }
    }
    if (key === null) return;
    saveDay(selDay);
    renderAll();
    toast("已归档：" + key);
  }
  function undoItem(day, id) {
    var a = days[day] || [];
    for (var i = 0; i < a.length; i++) {
      if (a[i].id === id) { a[i].d = false; a[i].da = null; break; }
    }
    saveDay(day);
    renderAll();
    toast("已退回待办");
  }
  function delItem(day, id) {
    var a = days[day] || [];
    days[day] = a.filter(function (it) { return it.id !== id; });
    saveDay(day);
    renderAll();
  }
  function editItem(day, id, text) {
    var a = days[day] || [];
    for (var i = 0; i < a.length; i++) {
      if (a[i].id === id) { a[i].t = String(text || "").trim(); break; }
    }
    saveDay(day);
  }

  /* ---------- 导出 Excel ---------- */
  function loadXlsx() {
    return new Promise(function (resolve, reject) {
      if (window.XLSX) return resolve();
      var s = document.createElement("script");
      s.src = "./assets/xlsx.full.min.js";
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error("load-failed")); };
      document.head.appendChild(s);
    });
  }
  function collectRows() {
    var rows = [["日期", "星期", "完成事项", "完成时间"]];
    var items = [];
    Object.keys(days).forEach(function (day) {
      (days[day] || []).forEach(function (it) {
        if (it && it.d) items.push({ day: day, t: it.t, da: it.da });
      });
    });
    items.sort(function (a, b) {
      if (a.day !== b.day) return a.day < b.day ? -1 : 1;
      return (a.da || 0) - (b.da || 0);
    });
    items.forEach(function (it) {
      var d = it.da ? new Date(it.da) : null;
      var full = d ? (it.day + " " + pad(d.getHours()) + ":" + pad(d.getMinutes())) : "";
      rows.push([it.day, wdText(it.day), it.t, full]);
    });
    return rows;
  }
  function csvFallback(rows) {
    var lines = rows.map(function (r) {
      return r.map(function (c) {
        return '"' + String(c == null ? "" : c).replace(/"/g, '""') + '"';
      }).join(",");
    });
    var blob = new Blob(["\ufeff" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "工作归档-" + new Date().getFullYear() + ".csv";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
  }
  function exportExcel() {
    var rows = collectRows();
    if (rows.length <= 1) { toast("还没有已归档的条目"); return; }
    toast("正在生成 Excel…");
    loadXlsx().then(function () {
      try {
        var ws = XLSX.utils.aoa_to_sheet(rows);
        ws["!cols"] = [{ wch: 12 }, { wch: 6 }, { wch: 52 }, { wch: 18 }];
        var wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "工作归档");
        XLSX.writeFile(wb, "工作归档-" + new Date().getFullYear() + ".xlsx");
        toast("已导出 " + (rows.length - 1) + " 条归档记录");
      } catch (e) {
        csvFallback(rows);
        toast("已导出 CSV（可由 Excel 打开）");
      }
    }).catch(function () {
      csvFallback(rows);
      toast("已导出 CSV（可由 Excel 打开）");
    });
  }

  /* ---------- 事件 ---------- */
  document.getElementById("addBtn").addEventListener("click", function () {
    var el = document.getElementById("newItem");
    if (addItem(el.value)) { el.value = ""; el.focus(); }
  });
  document.getElementById("newItem").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      if (addItem(this.value)) this.value = "";
    }
  });
  document.getElementById("planList").addEventListener("click", function (e) {
    var item = e.target.closest(".item");
    if (!item) return;
    var id = item.getAttribute("data-id");
    if (e.target.classList.contains("tick")) { toggleItem(id); return; }
    if (e.target.classList.contains("del")) { delItem(selDay, id); return; }
  });
  document.getElementById("planList").addEventListener("change", function (e) {
    var el = e.target;
    if (!el.classList || !el.classList.contains("txt")) return;
    var item = el.closest(".item");
    if (!item) return;
    editItem(selDay, item.getAttribute("data-id"), el.value);
  });
  document.getElementById("archList").addEventListener("click", function (e) {
    if (!e.target.classList.contains("undo")) return;
    var item = e.target.closest(".aitem");
    if (!item) return;
    undoItem(item.getAttribute("data-day"), item.getAttribute("data-id"));
  });
  document.getElementById("exportBtn").addEventListener("click", exportExcel);
  document.getElementById("dayInput").addEventListener("change", function () {
    if (this.value) { selDay = this.value; renderAll(); }
  });
  document.getElementById("prevDay").addEventListener("click", function () {
    var d = new Date(selDay); d.setDate(d.getDate() - 1); selDay = dstr(d); renderAll();
  });
  document.getElementById("nextDay").addEventListener("click", function () {
    var d = new Date(selDay); d.setDate(d.getDate() + 1); selDay = dstr(d); renderAll();
  });
  document.getElementById("todayBtn").addEventListener("click", function () {
    selDay = todayStr(); renderAll();
  });
  window.addEventListener("resize", function () { renderBears(); });

  /* ---------- 启动 ---------- */
  selDay = todayStr();
  days = readCache();
  renderAll();
  setConn("", "同步中…");

  if (window.WB) {
    WB.onNotify = toast;
    WB.onReady(function () {
      absorbCloud();
      rollover();
      renderAll();
      if (WB.error) setConn("bad", "云端暂不可用 · 显示本机数据");
      else setConn("ok", "已同步");
    });
    setTimeout(function () {
      if (document.getElementById("connTxt").textContent === "同步中…") {
        setConn("bad", "云端响应较慢 · 显示本机数据");
      }
    }, 8000);
  } else {
    setConn("bad", "离线模式 · 数据仅本机");
  }

  // 内部链接追加时间戳：绕过浏览器与 CDN 缓存
  Array.prototype.forEach.call(document.querySelectorAll('a[href$=".html"]'), function (a) {
    var h = a.getAttribute("href");
    if (h && h.indexOf("?") < 0) a.setAttribute("href", h + "?t=" + Date.now());
  });
})();
</script>

<script>var PAGE_VER="20260924004653";</script>
<script>
/* 版本自检 + 地址栏净化：
   1) 主页加载后立即把地址栏规范为站点根地址 /（根地址是跳转壳，刷新永远安全）；
   2) 本机若见过更新的版本（localStorage.wbBuild），立即切到带时间戳的最新地址——无需联网；
   3) 否则与服务器 version.json 核对版本，旧版自动跳转；
   4) 确认自己是最新版时，抹掉地址栏 ?t= 参数。
   防循环：同一目标版本最多连续跳 5 次，跳到最新版后计数清零。 */
(function () {
  var HOMES = ["index.html", "home.html", "home2.html", "home3.html"];
  var origPath = location.pathname;
  var nm = origPath.split("/").pop() || "index.html";
  var isHome = HOMES.indexOf(nm) >= 0;
  var hadParam = /[?&]t=\d{10,}/.test(location.href);
  function cleanUrl() {
    try {
      var u = new URL(location.href);
      u.searchParams.delete("t");
      var qs = u.searchParams.toString();
      var path = isHome ? origPath.replace(/[^/]*$/, "") : origPath;
      history.replaceState(null, "", path + (qs ? "?" + qs : "") + u.hash);
    } catch (e) {}
  }
  function hop(target) {
    var now = Date.now(), n = 0, t0 = 0, tv = "";
    try {
      var parts = (localStorage.getItem("wbHop") || "").split("|");
      tv = parts[0] || ""; n = +(parts[1] || 0) || 0; t0 = +(parts[2] || 0) || 0;
    } catch (e) {}
    if (tv !== String(target) || now - t0 > 600000) { n = 0; }
    if (n >= 5) return false;
    try { localStorage.setItem("wbHop", String(target) + "|" + (n + 1) + "|" + now); } catch (e) {}
    location.replace(origPath + "?t=" + now);
    return true;
  }
  function ok() {
    try { localStorage.removeItem("wbHop"); } catch (e) {}
    if (hadParam || isHome) cleanUrl();
  }
  if (!/^https?:$/.test(location.protocol) || typeof PAGE_VER === "undefined") return;
  if (isHome) cleanUrl();
  var myVer = parseInt(PAGE_VER, 10) || 0;
  var seen = 0;
  try { seen = parseInt(localStorage.getItem("wbBuild") || "0", 10) || 0; } catch (e) {}
  if (seen > myVer) { hop(seen); return; }
  if (myVer > seen) { try { localStorage.setItem("wbBuild", String(myVer)); } catch (e) {} }
  fetch("./version.json?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var latest = j && j[nm];
      if (!latest || latest === PAGE_VER) { ok(); return; }
      try { localStorage.setItem("wbBuild", String(latest)); } catch (e) {}
      hop(latest);
    })
    .catch(function () { if (hadParam) cleanUrl(); });
})();
</script>
